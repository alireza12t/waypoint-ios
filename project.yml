name: Waypoint
options:
  bundleIdPrefix: com.alireza
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Waypoint:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Waypoint
    info:
      path: Waypoint/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "Waypoint uses your location to show where you are on the map."
        NSCameraUsageDescription: "Waypoint uses the camera to scan QR codes and tickets."
        NSPhotoLibraryUsageDescription: "Waypoint reads photos of tickets and receipts."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alireza.waypoint
        SWIFT_VERSION: "5"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        DEVELOPMENT_TEAM: 9R2F9KNAK6
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
